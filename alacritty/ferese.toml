# Ferese Dark
# Alacritty color theme based on the Ferese editor palette.

[colors.primary]
background = "#12141A"
foreground = "#E6E9F2"
dim_foreground = "#8A92A6"
bright_foreground = "#F2F2F7"

[colors.cursor]
text = "#12141A"
cursor = "#6EA3FF"

[colors.vi_mode_cursor]
text = "#12141A"
cursor = "#B9A6FF"

[colors.selection]
text = "#E6E9F2"
background = "#263B66"

[colors.search.matches]
